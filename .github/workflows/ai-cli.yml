name: AI Linux CLI contract

on:
  push:
    branches: [main]
    paths:
      - "tool/ai/**"
      - "docs/AI_CLI.md"
      - ".github/workflows/ai-cli.yml"
  workflow_dispatch:

jobs:
  ai-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python CLI and tests
        run: python3 -m py_compile tool/ai/ai tool/ai/test_ai.py
      - name: Run CPU CLI tests without a model download
        run: python3 -m unittest discover -s tool/ai -p 'test_*.py' -v
