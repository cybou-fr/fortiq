# The gate for main (AGENTS.md: main is the only branch). Runs tool/ci_check.py, the same script a developer runs by hand.
# Not yet executed on GitHub: written and syntax-checked locally only (docs/AUDIT_2026-10-23.md, R6).
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 6.12 (MSVC 2022, 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: libssh2 (vcpkg)
        run: vcpkg install libssh2:x64-windows
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Gate (docs, scripts, build, offline tests, layout stress)
        run: >
          python tool/ci_check.py
          --qt-prefix "$env:QT_ROOT_DIR"
          --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          --stress 1
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build-ci/**/*.txt
