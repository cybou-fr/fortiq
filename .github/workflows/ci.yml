# The gate for main (AGENTS.md: main is the only branch). Runs tool/ci_check.py, the same script a developer runs by hand.
# Not yet executed on GitHub: written and syntax-checked locally only (docs/AUDIT_2026-10-23.md, R6, docs/PRODUCTION_READINESS.md G3).
# This is the OFFLINE gate. The live Debian suite and package qualification are separate gates (docs/PRODUCTION_READINESS.md).
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 6.12 (MSVC 2022, 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: libssh2 and OpenSSL (vcpkg, FORTIQ overlay ports - the same pinned code as the local and Android builds)
        run: vcpkg install libssh2:x64-windows --overlay-ports="$env:GITHUB_WORKSPACE/third_party/vcpkg-overlay-ports" --recurse
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Gate (docs, scripts, build, offline tests, layout stress)
        run: >
          python tool/ci_check.py
          --qt-prefix "$env:QT_ROOT_DIR"
          --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          --stress 1
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build-ci/**/*.txt

  linux-sanitizers:
    # Unit tests and the fuzz smoke run under AddressSanitizer + UndefinedBehaviorSanitizer (docs/FUZZING.md). Not yet run on GitHub.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools libssh2-1-dev libssl-dev
      - name: Build with sanitizers
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DFORTIQ_SANITIZE=ON
          cmake --build build-san
      - name: Tests (the layout test needs the Windows kit and is covered by the other job)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-san -E "layout|brand|ssh_integration" --output-on-failure
