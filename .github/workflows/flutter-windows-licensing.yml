name: FORTIQ Windows licensing

on:
  push:
    branches: [main]
    paths:
      - "lib/services/license_service.dart"
      - "lib/widgets/license_gate.dart"
      - "lib/main.dart"
      - "windows/runner/**"
      - "test/license_service_test.dart"
      - "test/ai_service_test.dart"
      - "test/shell_quote_test.dart"
      - "test/services_test.dart"
      - "test/mail_service_test.dart"
      - "lib/services/mail_service.dart"
      - "lib/widgets/mailbox_viewer.dart"
      - "lib/services/ai_service.dart"
      - "lib/services/ssh_service.dart"
      - "lib/services/shell.dart"
      - "lib/widgets/ai_advice_dialog.dart"
      - "lib/widgets/log_viewer.dart"
      - "lib/widgets/service_manager.dart"
      - "pubspec.yaml"
      - ".github/workflows/flutter-windows-licensing.yml"
  workflow_dispatch:

jobs:
  license-check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze licensing code
        run: flutter analyze lib/services/license_service.dart lib/widgets/license_gate.dart test/license_service_test.dart
      - name: Test licensing behavior
        run: flutter test test/license_service_test.dart
      - name: Analyze Linux AI GUI integration
        run: flutter analyze lib/services/ai_service.dart lib/services/ssh_service.dart lib/services/shell.dart lib/widgets/ai_advice_dialog.dart lib/widgets/log_viewer.dart lib/widgets/service_manager.dart test/ai_service_test.dart
      - name: Test Linux AI adapter and licensing
        run: flutter test test/ai_service_test.dart test/ai_advice_dialog_test.dart test/shell_quote_test.dart test/services_test.dart test/mail_service_test.dart
      - name: Build Windows debug
        run: flutter build windows --debug
